name: checks
on:
  workflow_call:
    inputs:
      lowest-direct:
        description: >-
          Run the declared dependency floors. Off for PRs: the job resolves direct dependencies at
          their floor and transitives at their newest, so a release published upstream today can
          turn it red for reasons no PR here caused. scheduled.yml turns it on, where that failure
          opens a tracking issue instead of blocking a merge.
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.10
      - run: uv python pin 3.10
      - run: just install lint-ci

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # --offline blocks network requests and excludes every external URL, so this gate
      # is deterministic: it fails only on a relative link or file path a diff broke.
      # Tag-pinned and cross-repo URLs do not match the --remap pattern and stay
      # excluded: they point at trees this checkout does not have.
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --remap
            'https://github\.com/${{ github.repository }}/(?:blob|tree)/main/(.*) file://${{ github.workspace }}/$1'
            '**/*.md'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
      - run: just docs-build

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv python pin ${{ matrix.python-version }}
      - run: just install
      - run: just test-ci
  free-threaded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13t"
            extras: "logging,sentry,fastapi,faststream,fastapi-metrics,faststream-metrics,otl-http"
          - python-version: "3.14t"
            extras: "logging,sentry,fastapi,litestar,faststream,fastmcp,fastapi-metrics,litestar-metrics,faststream-metrics,fastmcp-metrics,otl-http"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - name: Install core + ft-ready extras (orjson/otl-grpc/pyroscope excluded; otl-http included; litestar/fastmcp 3.14t-only)
        run: uv pip install ".[${{ matrix.extras }}]"
      - name: Free-threaded smoke test
        run: .venv/bin/python scripts/ft_smoke.py

  install-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.10
      - name: Each extra installs and imports in isolation
        run: |
          set -uo pipefail
          # GitHub runs run-steps with `bash -eo pipefail`; disable errexit so a
          # venv-create/cleanup hiccup can't abort the loop before every extra is
          # checked — failures are collected explicitly in `failed` below.
          set +e
          extras="orjson sentry pyroscope otl otl-http logging free-all \
            fastapi fastapi-sentry fastapi-otl fastapi-logging fastapi-metrics fastapi-all \
            litestar litestar-sentry litestar-otl litestar-logging litestar-metrics litestar-all \
            faststream faststream-sentry faststream-otl faststream-logging faststream-metrics faststream-all \
            fastmcp fastmcp-metrics fastmcp-all"
          failed=""
          uv venv --python 3.10 .v-bare >/dev/null
          if uv pip install --python .v-bare/bin/python . >/dev/null 2>&1 \
               && .v-bare/bin/python -c "import lite_bootstrap"; then :; else failed="$failed __bare__"; fi
          rm -rf .v-bare
          for e in $extras; do
            uv venv --python 3.10 ".v-$e" >/dev/null
            if uv pip install --python ".v-$e/bin/python" ".[$e]" >/dev/null 2>&1 \
                 && ".v-$e/bin/python" -c "import lite_bootstrap"; then :; else failed="$failed $e"; fi
            rm -rf ".v-$e"
          done
          if [ -n "$failed" ]; then echo "::error::extras failed isolated install+import:$failed"; exit 1; fi
          echo "all extras install and import in isolation"

  lowest-direct:
    # Every other job resolves newest, so a declared floor is a claim nothing checks. This one
    # pins each direct dependency to the floor pyproject.toml declares and bootstraps against it.
    # Per framework rather than all-extras at once: a floor declared in one extra pulls the shared
    # stack up for the others, so a combined resolution tests a set no user installs.
    # Runtime smoke only, by design (#236): pytest cannot run here because conftest.py hard-imports
    # opentelemetry, sentry_sdk and structlog, and `ty` would report the frameworks this target
    # deliberately did not install as unresolved. So nothing type-checks at the floor - an
    # annotation naming an optional dependency's internals has to span the declared range, and only
    # a human checks that.
    if: inputs.lowest-direct
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target: [free, fastapi, litestar, faststream, fastmcp]
        # These `include` entries name an existing `target`, so each adds `extras` to that
        # target's five combinations rather than creating a job of its own. `free` carries
        # orjson because it belongs to no *-all extra and its floor is a wheel-availability
        # one, which only an interpreter matrix can check.
        include:
          - {target: free, extras: "free-all,orjson"}
          - {target: fastapi, extras: "fastapi-all"}
          - {target: litestar, extras: "litestar-all"}
          - {target: faststream, extras: "faststream-all"}
          - {target: fastmcp, extras: "fastmcp-all"}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      # --only-binary rather than --no-build, which would refuse to build this project too while
      # floor_smoke.py imports it. Naming packages is what tests/test_floors_wheel_only.py keeps
      # from drifting as dependencies are added.
      - name: Install at the declared floors
        run: >-
          uv pip install --resolution lowest-direct
          --only-binary fastapi,fastmcp,faststream,litestar,orjson,pydantic
          --only-binary opentelemetry-api,opentelemetry-sdk,opentelemetry-instrumentation
          --only-binary opentelemetry-instrumentation-asgi,opentelemetry-instrumentation-fastapi
          --only-binary opentelemetry-exporter-otlp-proto-grpc,opentelemetry-exporter-otlp-proto-http
          --only-binary prometheus-client,prometheus-fastapi-instrumentator
          --only-binary pyroscope-io,sentry-sdk,structlog,typing-extensions
          ".[${{ matrix.extras }}]"
      - name: Bootstrap at the floors
        run: .venv/bin/python scripts/floor_smoke.py ${{ matrix.target }}
